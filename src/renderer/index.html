<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>RT Audio Studio</title>
<style>
  :root { color-scheme: light dark; --bg: #f0eef6; --ink: #1f1b2b; --muted: #6c6680; }
  @media (prefers-color-scheme: dark) { :root { --bg: #100e17; --ink: #ebe8f4; --muted: #958fa8; } }
  body { margin: 0; height: 100vh; display: grid; place-content: center; gap: 8px; text-align: center;
    background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  h1 { margin: 0; font-size: 22px; } p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
  <h1>RT Audio Studio</h1>
  <p>Step zero: the groundwork. There's nothing to record with yet.</p>
</body>
</html>
